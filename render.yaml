services:
  - type: web
    name: skiniq-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "uvicorn backend.app:app --host 0.0.0.0 --port $PORT"
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skiniq-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: "*"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: SkinIQ

databases:
  - name: skiniq-db
    databaseName: skiniq
    user: skiniq_user
    plan: free
    region: oregon
